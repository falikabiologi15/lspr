<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SL Delayota Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    <style>
      
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
            background-image: url('https://images.unsplash.com/photo-1486006920555-c77dce18193b?q=80&w=1920&h=1080&fit=crop'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

    
        .login-container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .login-container h2 {
            font-family: 'Oswald', sans-serif;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.2em;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 0.95em;
            font-weight: bold;
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: calc(100% - 20px);
            padding: 12px 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="password"]:focus {
            border-color: #e74c3c;
            outline: none;
            box-shadow: 0 0 8px rgba(231, 76, 60, 0.3);
        }

        .form-group.checkbox-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: -10px;
            margin-bottom: 25px;
        }

        .form-group.checkbox-group input[type="checkbox"] {
            margin-right: 8px;
            accent-color: #e74c3c;
        }

        .form-group.checkbox-group label {
            margin-bottom: 0;
            display: inline-block;
            font-weight: normal;
        }

        .forgot-password {
            font-size: 0.9em;
        }

        .forgot-password a {
            color: #e74c3c;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .forgot-password a:hover {
            text-decoration: underline;
            color: #c0392b;
        }

        .btn-submit {
            background-color: #e74c3c;
            color: white;
            padding: 15px 25px;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 10px;
        }

        .btn-submit:hover {
            background-color: #c0392b;
            transform: translateY(-2px);
        }

        .btn-home {
            background-color: #7f8c8d;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
            text-transform: uppercase;
        }

        .btn-home:hover {
            background-color: #95a5a6;
        }

        .alert {
            background-color: #e44e4e;
            color: white;
            padding: 10px;
            text-align: center;
            border: 1px solid #b32929;
            margin-top: 15px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Student Lounge Login</h2>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Nama Pengguna</label>
                <input type="text" id="username" placeholder="Nama Pengguna .." required="required">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Password .." required="required">
            </div>
            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" name="remember_me"> Ingat saya
                </label>
                <span class="forgot-password">
                    <a href="#">Lupa Password?</a>
                </span>
            </div>
            
            <button type="submit" class="btn-submit">masuk</button>
            
            <button type="button" class="btn-home" onclick="location.href='../index.html';">Kembali</button>
            
            <p id="message" style="color: #e74c3c; font-weight: bold; margin-top: 10px;"></p>
            
            <div id="alertBox" class="alert" style="display:none;"></div>
        </form>
        
        <div class="login-footer">
            Tidak punya akun? <a href="register.html">Daftar di sini</a>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
